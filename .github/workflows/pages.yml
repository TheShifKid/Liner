# Builds the static site and publishes it to GitHub Pages.
#   • On every push to main: build with the chart files already in the repo.
#   • Every Monday: first rebuild the charts from fresh ListenBrainz +
#     Wikipedia data, commit them, then build and publish.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (an odd minute avoids the on-the-hour rush)
  workflow_dispatch: # also allows a manual "Run workflow" button

permissions:
  contents: write # to commit refreshed charts
  pages: write
  id-token: write

# Never run two deployments at once; a newer run cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh charts (weekly / manual runs only)
        if: github.event_name != 'push'
        # If ListenBrainz or MusicBrainz is down, keep last week's charts.
        continue-on-error: true
        run: |
          node scripts/build-charts.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/charts
          git diff --cached --quiet || (git commit -m "Refresh charts" && git push)

      - run: npm run build
        env:
          # The site lives at https://theshifkid.github.io/Liner/, so every
          # link and asset needs this prefix (see next.config.ts).
          NEXT_PUBLIC_BASE_PATH: /Liner
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
